---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  config:
    uses: ./.github/workflows/config.yml

  test:
    name: Test
    needs: config
    strategy:
      fail-fast: false
      matrix:
        version_branch: ${{ fromJSON(needs.config.outputs.versions) }}
    uses: ./.github/workflows/test-image.yml
    with:
      version_branch: ${{ matrix.version_branch }}