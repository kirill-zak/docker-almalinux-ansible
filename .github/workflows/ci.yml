---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  config:
    uses: ./.github/workflows/config.yml

  test:
    name: Test
    needs: config
    strategy:
      fail-fast: false
      matrix:
        version_branch: ${{ fromJSON(needs.config.outputs.versions) }}
    uses: ./.github/workflows/test-image.yml
    with:
      version_branch: ${{ matrix.version_branch }}

  test-gate:
    # Stable check name independent of the version matrix, so the master
    # branch ruleset never needs updating when versions change.
    name: Test gate
    needs: [config, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required check did not pass
        run: |
          if [ "${{ needs.config.result }}" != success ] || \
             [ "${{ needs.test.result }}" != success ]; then
            echo "::error::config or test checks did not pass"
            exit 1
          fi
          echo "All required checks passed"