---
name: Configuration

on:
  workflow_call:
    outputs:
      versions:
        description: JSON-массив поддерживаемых версий
        value: ${{ jobs.config.outputs.versions }}
      platforms:
        description: JSON-массив поддерживаемых платформ
        value: ${{ jobs.config.outputs.platforms }}
      latest_version:
        description: Версия, несущая тег latest
        value: ${{ jobs.config.outputs.latest_version }}

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.values.outputs.versions }}
      platforms: ${{ steps.values.outputs.platforms }}
      latest_version: ${{ steps.values.outputs.latest_version }}
    steps:
      - id: values
        run: |
          {
            echo 'versions=["9.0","9.1","9.2","9.3","9.4","9.5","9.6","9.7","9.8","10.0","10.1","10.2"]'
            echo 'platforms=["linux/amd64","linux/arm64/v8","linux/ppc64le","linux/s390x"]'
            echo 'latest_version=10.2'
          } >> "$GITHUB_OUTPUT"