---
name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Validate tag format (vx.x.x)
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "Checking tag: ${tag}"
          if ! echo "$tag" | grep -Eq '^v?[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "::error::Invalid release tag '${tag}'."
            echo "::error::Expected x.x.x, each part 1-2 digits, optional 'v' prefix (e.g., 2.0.0, 10.1.12, v1.12.1), no pre-release suffixes."
            exit 1
          fi

  config:
    uses: ./.github/workflows/config.yml

  test:
    name: Test
    needs: config
    strategy:
      fail-fast: false
      matrix:
        version_branch: ${{ fromJSON(needs.config.outputs.versions) }}
    uses: ./.github/workflows/test-image.yml
    with:
      version_branch: ${{ matrix.version_branch }}

  release:
    name: Release ${{ matrix.version_branch }}
    needs: [config, test, validate-tag]
    permissions:
      contents: read
      packages: write
    if: ${{ needs.test.result == 'success' && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        version_branch: ${{ fromJSON(needs.config.outputs.versions) }}
    uses: ./.github/workflows/build-image.yml
    with:
      version_branch: ${{ matrix.version_branch }}
      platforms: ${{ join(fromJSON(needs.config.outputs.platforms), ',') }}
      additional_tags: ${{ matrix.version_branch == needs.config.outputs.latest_version && 'latest' || '' }}
      push: true
    secrets: inherit