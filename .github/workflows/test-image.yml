---
name: Test image

on:
  workflow_call:
    inputs:
      version-branch:
        description: Major AlmaLinux version to test (9 or 10)
        required: true
        type: string
      version-minor:
        description: AlmaLinux minor release to test (e.g. '7' for 9.7)
        required: true
        type: string
      ref:
        description: Git ref to check out
        required: true
        type: string

jobs:
  test:
    name: Test ${{ inputs.version-branch }}.${{ inputs.version-minor }}
    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Test building image
        run: podman build -t docker-almalinux-ansible:${{ inputs.version-branch }}.${{ inputs.version-minor }} ./almalinux${{ inputs.version-branch }}/. --build-arg VERSION=${{ inputs.version-branch }}.${{ inputs.version-minor }}

      - name: Run the built image
        run: podman run --name test-container --detach --privileged --volume /sys/fs/cgroup:/sys/fs/cgroup:ro docker-almalinux-ansible:${{ inputs.version-branch }}.${{ inputs.version-minor }}

      - name: Verify Ansible is accessible in the built image
        run: podman exec --tty test-container env TERM=xterm ansible --version