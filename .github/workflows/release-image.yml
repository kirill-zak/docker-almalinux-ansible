---
name: Build and push image

on:
  workflow_call:
    inputs:
      version:
        description: Full image version, e.g. '9.7'
        required: true
        type: string
      version-major:
        description: Major AlmaLinux version, e.g. '9'
        required: true
        type: string
      image-tag:
        description: Tag to push to both registries, e.g. '9.7' or 'latest'
        required: true
        type: string
      platforms:
        description: Comma-separated target platforms
        required: true
        type: string
      ref:
        description: Git ref to check out
        required: true
        type: string

env:
  REGISTRY_IMAGE: kirillzak/docker-almalinux-ansible

jobs:
  release:
    name: Release ${{ inputs.image-tag }}
    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Add Qemu
        uses: docker/setup-qemu-action@v4

      - name: Add Docker BuildX
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          build-args: VERSION=${{ inputs.version }}
          context: ./almalinux${{ inputs.version-major }}
          file: Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ inputs.platforms }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},name-canonical=true
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ inputs.image-tag }}
            ghcr.io/${{ github.repository }}:${{ inputs.image-tag }}